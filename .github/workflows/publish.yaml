name: push-subtree
on:
  push:
    branches: [main]          # trunk
jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # subtree math needs full history
      - name: split & push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dir=public
          pub=git@github.com:jordanrubin/FUTURE_TOKENS.git
          git config --global user.email "jordan1337rubin@gmail.com"
          git config --global user.name  "jordanrubin"
          rev=$(git subtree split --prefix="$dir" -q)
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/jordanrubin/FUTURE_TOKENS.git" "$rev":main