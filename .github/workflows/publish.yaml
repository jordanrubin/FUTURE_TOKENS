name: push-subtree
on:
  push:
    branches: [main]          # trunk
jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # subtree math needs full history
      - name: add key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SUBTREE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: split & push
        run: |
          dir=public
          pub=git@github.com:jordanrubin/FUTURE_TOKENS.git
          git config --global user.email "jordan1337rubin@gmail.com"
          git config --global user.name  "jordanrubin"
          rev=$(git subtree split --prefix="$dir" -q)
          git push --force "$pub" "$rev:refs/heads/main"